

services:
  db:
    image: postgres:latest
    container_name: db
    volumes:
      - postgres_db:/var/lib/postgresql
    env_file:
      - ./tutorial1/.env.docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 10
        
    

  backend:
    build : ./tutorial1
    container_name: backend
    ports:
      - 8000:8000

    volumes:
      - ./tutorial1:/app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./tutorial1/.env

volumes:
  postgres_db: